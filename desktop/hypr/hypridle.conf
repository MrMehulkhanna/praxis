# hypridle — OLED-protective idle behaviour (turned on from Settings › Display ›
# OLED care, which only appears when an OLED panel is detected).
# SAFE version: only DIMS on idle (reliably wakes on activity). It does NOT
# DPMS-off the panel — on some OLEDs a DPMS-off/on cycle can leave the
# screen black until forced back on. Dimming a static image is the main
# burn-in reducer anyway. Opt-in via Settings → Display → OLED care.

general {
    lock_cmd = pidof hyprlock || hyprlock
    ignore_dbus_inhibit = false
}

# dim the OLED after 4 min idle — the biggest burn-in reducer, wakes instantly
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%      # the panel's backlight, whichever GPU drives it
    on-resume  = brightnessctl -r
}

# lock after 12 min idle (screen stays on and visible — no blanking)
listener {
    timeout = 720
    on-timeout = pidof hyprlock || hyprlock
}

# suspend after 25 min, ONLY on battery (AC stays awake for downloads/builds)
listener {
    timeout = 1500
    on-timeout = grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend || true
}
