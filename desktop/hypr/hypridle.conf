# hypridle — idle management: dim, lock, screen off, and suspend.
# Wakes instantly on any keyboard, mouse, or touchpad activity.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# dim screen after 4 min
listener {
    timeout = 240
    on-timeout = praxis-brightness save 15
    on-resume  = praxis-brightness restore
}

# lock session after 10 min
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# turn screen off after 12 min
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# suspend after 20 min idle
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
