# hypridle — OLED-protective idle behaviour for the Samsung ATNA56 panel.
# SAFE version: only DIMS on idle (reliably wakes on activity). It does NOT
# DPMS-off the panel — on this OLED, a DPMS-off/on cycle could leave the
# screen black until forced back on. Dimming a static image is the main
# burn-in reducer anyway. Opt-in via Settings → Display → OLED care.

general {
    lock_cmd = pidof hyprlock || hyprlock
    ignore_dbus_inhibit = false
}

# dim the OLED after 4 min idle — the biggest burn-in reducer, wakes instantly
listener {
    timeout = 240
    on-timeout = brightnessctl -sd nvidia_0 set 15%
    on-resume  = brightnessctl -rd nvidia_0
}

# lock after 12 min idle (screen stays on and visible — no blanking)
listener {
    timeout = 720
    on-timeout = pidof hyprlock || hyprlock
}

# suspend after 25 min, ONLY on battery (AC stays awake for downloads/builds)
listener {
    timeout = 1500
    on-timeout = test "$(cat /sys/class/power_supply/ADP1/online)" = 0 && systemctl suspend || true
}
