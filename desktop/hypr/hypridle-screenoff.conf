# hypridle — idle behaviour for regular (non-OLED) screens, turned on from
# Settings › Display › "Screen off when idle". Dims, locks, then turns the
# screens off; on battery it also suspends. (OLED panels use hypridle.conf,
# which never blanks the panel.)

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 15%
    on-resume  = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1500
    on-timeout = grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend || true
}
