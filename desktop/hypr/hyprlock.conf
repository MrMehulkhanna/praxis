# hyprlock — lock screen for the AIOS desktop. Dark, blurred, minimal.
$font = Adwaita Sans
$accent = rgb(7aa2f7)
$text = rgb(edf2f7)
$muted = rgb(9ca8b8)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/charcoal-blue.png
    color = rgb(0b0d12)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

# user avatar circle (initial)
label {
    monitor =
    text =
    color = $accent
    position = 0, 60
    halign = center
    valign = bottom
}

# greeting
label {
    monitor =
    text = Welcome back, $USER
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, 20
    halign = center
    valign = bottom
}

# password input
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.5)
    inner_color = rgba(18, 22, 30, 0.85)
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##9ca8b8">Password</span>
    hide_input = false
    check_color = $accent
    fail_color = rgb(ef8f9d)
    fail_text = <span>$FAIL ($ATTEMPTS)</span>
    rounding = 26
    position = 0, -120
    halign = center
    valign = center
}
