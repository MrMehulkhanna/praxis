monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*speaker*"
      }
      {
        node.name = "~alsa_output.*Speaker*"
      }
      {
        node.name = "~alsa_output.*Headphones*"
      }
      {
        node.name = "~alsa_output.*headphones*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1009
        priority.session = 1009
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.*hdmi*"
      }
      {
        node.name = "~alsa_output.*HDMI*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 600
        priority.session = 600
      }
    }
  }
]
