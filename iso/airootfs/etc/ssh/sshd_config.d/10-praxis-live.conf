# Live media only (installed systems don't get this file): the live account
# "praxis" has a published password and passwordless sudo, so it must never
# be usable over SSH. sshd is off on the live image anyway; if you start it,
# log in with a key, or set your own password first:  passwd
Match User praxis
    PasswordAuthentication no
    KbdInteractiveAuthentication no
