# /etc/security/faillock.conf
# Praxis account lockout policy: prevent locking out system administrator and primary user

# Deny access after 10 consecutive failed attempts
deny = 10

# Unlock after 60 seconds (instead of 10 minutes)
unlock_time = 60

# Fail interval window of 15 minutes
fail_interval = 900

# Root account is never permanently locked out
even_deny_root = false

# Members of wheel (administrative user) are protected like root
admin_group = wheel
