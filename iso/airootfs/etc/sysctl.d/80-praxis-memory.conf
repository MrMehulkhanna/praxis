# Praxis memory tuning for zram swap (same idea as Pop!_OS / Fedora / CachyOS):
# swapping to compressed RAM is cheap, so prefer it over dropping file cache
# (which holds mmap'd AI models and app code), read single pages from swap,
# and start reclaiming earlier so allocations never stall the desktop.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
