# Compressed swap in RAM (zram-generator) — no disk swap, no SSD wear.
# Sized like the RAM (at most 16 GiB of swap); zstd packs it ~3:1, so a full
# zram on a 16 GB laptop costs ~5 GB of real memory and buys ~11 GB of headroom
# before anything has to be stopped. Tuned by /etc/sysctl.d/80-praxis-memory.conf.
[zram0]
zram-size = min(ram, 16384)
compression-algorithm = zstd
swap-priority = 100
