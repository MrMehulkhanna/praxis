# GTK apps (Thunar, zenity, the portal dialogs) otherwise come up in the
# light default theme, which looks wrong next to a dark Wayland shell, and
# fall back to Adwaita icons that do not match the rest of the desktop.
[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
