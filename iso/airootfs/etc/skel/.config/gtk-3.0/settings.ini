# Without an icon theme set, GTK apps fall back to hicolor, which carries
# almost nothing — Thunar came up in the dock wearing the generic X11
# drafting icon, and every app in the launcher grid had the same problem.
[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
