# Praxis: the AI backend (and the llama-server it starts) must never make the
# desktop stutter or freeze, and it can be switched off from Control Center.
[Unit]
# `praxis-mode ai off` / Game mode: stay off, even when something asks to start it
ConditionPathExists=!%h/.config/praxis/ai-off
ConditionPathExists=!%t/praxis/ai-off-game

[Service]
# half the CPU and disk share of normal apps when both want them
CPUWeight=50
IOWeight=50
# if memory runs out, the model server is the first thing the kernel or
# earlyoom stops — not the compositor, the shell or your browser
OOMScoreAdjust=500
