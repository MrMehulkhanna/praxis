# Praxis: notifications are drawn in software. A popup doesn't need a GPU, and
# with OpenGL, GTK picks the NVIDIA GPU on hybrid laptops and keeps it awake.
# (Applies however swaync starts: from Hyprland, or by D-Bus activation.)
[Service]
Environment=GSK_RENDERER=cairo
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
